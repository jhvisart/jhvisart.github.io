<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SINGULARITY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --cyan:#00f5ff;--magenta:#ff006e;--white:#f0f8ff;
  --dim:#0a0a0f;--void:#03030a;--plasma:#7b2fff;
}
html,body{width:100%;height:100%;min-height:100dvh;background:var(--void);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:none}
@media (hover:hover) and (pointer:fine){html,body{cursor:none}}
@media (hover:none),(pointer:coarse){#cur,#cur-ring{display:none!important}}

/* Cursor */
#cur{position:fixed;width:8px;height:8px;background:var(--cyan);border-radius:50%;pointer-events:none;z-index:1000;transform:translate(-50%,-50%);box-shadow:0 0 14px 3px rgba(0,245,255,.7);transition:width .1s,height .1s}
#cur-ring{position:fixed;width:34px;height:34px;border:1px solid rgba(0,245,255,.3);border-radius:50%;pointer-events:none;z-index:999;transform:translate(-50%,-50%)}

canvas{position:fixed;top:0;left:0;width:100%;height:100%}

/* Vignette */
#vig{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(3,3,10,.95) 100%);pointer-events:none;z-index:5}

/* Scanlines */
#scan{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,245,255,.012) 2px,rgba(0,245,255,.012) 4px);pointer-events:none;z-index:6;animation:scanmove 12s linear infinite}
@keyframes scanmove{from{background-position:0 0}to{background-position:0 100px}}

/* UI */
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}

/* Top */
#topbar{position:absolute;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top)) max(18px,calc(24px + env(safe-area-inset-right))) 0 max(18px,calc(24px + env(safe-area-inset-left)));display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.tl{opacity:0;animation:fu .6s ease forwards 1s}
.tr{opacity:0;animation:fu .6s ease forwards 1.2s;text-align:right}
.brand{font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:.6em;color:rgba(0,245,255,.45);display:block}
.brand-sub{font-family:'Rajdhani',sans-serif;font-size:.65rem;color:rgba(240,248,255,.2);letter-spacing:.25em;margin-top:3px;display:block}

/* Title */
#center-ui{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
#title-main{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(2.5rem,7vw,6rem);letter-spacing:.35em;color:transparent;background:linear-gradient(135deg,var(--white) 0%,var(--cyan) 40%,var(--plasma) 80%,var(--magenta) 100%);-webkit-background-clip:text;background-clip:text;opacity:0;animation:trev 1.8s cubic-bezier(.16,1,.3,1) forwards .4s;filter:drop-shadow(0 0 30px rgba(0,245,255,.4))}
@keyframes trev{from{opacity:0;letter-spacing:.6em;transform:scale(.92)}to{opacity:1;letter-spacing:.35em;transform:scale(1)}}
#title-sub{font-family:'Rajdhani',sans-serif;font-size:clamp(.65rem,1.6vw,.95rem);letter-spacing:.55em;color:rgba(0,245,255,.35);margin-top:14px;opacity:0;animation:fu .7s ease forwards 1.1s;text-transform:uppercase}
#title-line{width:1px;height:0;background:linear-gradient(180deg,transparent,var(--cyan),transparent);margin:20px auto;animation:lg .5s ease forwards 1.7s}
@keyframes lg{to{height:50px}}
#hint{font-family:'Rajdhani',sans-serif;font-size:.5rem;letter-spacing:.45em;color:rgba(0,245,255,.25);opacity:0;animation:fu .5s ease forwards 2.1s,breathe 3s ease-in-out infinite 2.6s;text-transform:uppercase}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.5}}

/* Corners */
.cm{position:absolute;width:22px;height:22px;opacity:0;animation:fi .3s ease forwards}
.cm svg{width:100%;height:100%}
.cm-tl{top:18px;left:18px;animation-delay:2s}.cm-tr{top:18px;right:18px;animation-delay:2.1s}
.cm-bl{bottom:18px;left:18px;animation-delay:2.2s}.cm-br{bottom:18px;right:18px;animation-delay:2.3s}

/* H-rules */
.hr{position:absolute;left:42px;right:42px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,245,255,.08),transparent);opacity:0;animation:fi .3s ease forwards}
.hr-t{top:70px;animation-delay:1.8s}.hr-b{bottom:70px;animation-delay:1.9s}

/* Bottom bar */
#botbar{position:absolute;bottom:0;left:0;right:0;padding:0 max(18px,calc(24px + env(safe-area-inset-right))) calc(18px + env(safe-area-inset-bottom)) max(18px,calc(24px + env(safe-area-inset-left)));display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bs{opacity:0;animation:fu .5s ease forwards}
.bs1{animation-delay:1.8s}.bs2{animation-delay:1.9s}.bs3{animation-delay:2s}.bs4{animation-delay:2.1s}
.sl{font-family:'Orbitron',sans-serif;font-size:.38rem;letter-spacing:.5em;color:rgba(0,245,255,.3);display:block}
.sv{font-family:'Rajdhani',sans-serif;font-size:.8rem;color:rgba(240,248,255,.22);letter-spacing:.15em;display:block;margin-top:2px}

/* Upload panel */
#upload-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:18px;transition:opacity .6s,transform .6s;pointer-events:auto}
#upload-panel.gone{opacity:0;transform:translate(-50%,calc(-50% + 20px));pointer-events:none}
.dz{border:1px solid rgba(0,245,255,.2);padding:26px clamp(24px,7vw,50px);text-align:center;cursor:pointer;background:rgba(0,245,255,.02);transition:all .3s;position:relative;clip-path:polygon(12px 0%,100% 0%,100% calc(100% - 12px),calc(100% - 12px) 100%,0% 100%,0% 12px)}
.dz::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,245,255,.04) 0%,transparent 50%);pointer-events:none}
.dz:hover{border-color:rgba(0,245,255,.5);background:rgba(0,245,255,.06);box-shadow:0 0 30px rgba(0,245,255,.12),inset 0 0 30px rgba(0,245,255,.03)}
.dz.over{border-color:var(--magenta);box-shadow:0 0 30px rgba(255,0,110,.25)}
.dz-ico{font-size:1.6rem;display:block;margin-bottom:10px;color:var(--cyan)}
.dz h3{font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:.4em;color:rgba(0,245,255,.65);margin-bottom:5px}
.dz p{font-size:.52rem;color:rgba(240,248,255,.25);letter-spacing:.15em;font-family:'Rajdhani',sans-serif}
#fi{display:none}

/* Now playing */
#nowplay{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;text-align:center;opacity:0;transition:opacity .6s;pointer-events:none}
#nowplay.show{opacity:1;pointer-events:auto}
#tname{font-family:'Orbitron',sans-serif;font-size:clamp(.48rem,1.3vw,.72rem);letter-spacing:.3em;color:rgba(0,245,255,.7);margin-bottom:10px;filter:drop-shadow(0 0 8px rgba(0,245,255,.5))}
.pbc{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
#pw{width:min(260px,72vw);height:1px;background:rgba(0,245,255,.12);cursor:pointer;margin:0 auto 8px;position:relative}
#pb{height:100%;background:linear-gradient(90deg,var(--cyan),var(--magenta));width:0%;box-shadow:0 0 6px var(--cyan)}
#td{font-size:.46rem;color:rgba(240,248,255,.25);letter-spacing:.18em;font-family:'Rajdhani',sans-serif}

.btn{font-family:'Orbitron',sans-serif;font-size:.45rem;letter-spacing:.3em;padding:10px 18px;min-height:44px;border:1px solid rgba(0,245,255,.3);background:transparent;color:rgba(0,245,255,.6);cursor:pointer;transition:all .25s;clip-path:polygon(8px 0%,100% 0%,100% calc(100% - 8px),calc(100% - 8px) 100%,0% 100%,0% 8px)}
.btn:hover{color:var(--cyan);border-color:rgba(0,245,255,.7);box-shadow:0 0 16px rgba(0,245,255,.25);background:rgba(0,245,255,.06)}
.btn.mg{border-color:rgba(255,0,110,.3);color:rgba(255,0,110,.6)}
.btn.mg:hover{color:var(--magenta);border-color:rgba(255,0,110,.7);box-shadow:0 0 16px rgba(255,0,110,.25)}

/* EQ */
#eq-bars{position:fixed;bottom:0;left:0;right:0;height:52px;z-index:8;pointer-events:none;display:flex;align-items:flex-end;gap:1px;padding:0 max(18px,calc(24px + env(safe-area-inset-right))) 0 max(18px,calc(24px + env(safe-area-inset-left)));opacity:0;transition:opacity .6s}
#eq-bars.show{opacity:1}
.eqb{flex:1;background:linear-gradient(0deg,rgba(0,245,255,.5),rgba(123,47,255,.2));transform-origin:bottom;height:0}

/* Waveform ring */
#wave-canvas{position:fixed;inset:0;pointer-events:none;z-index:4}

@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}


/* Responsive + touch */
@media (max-width: 760px){
  #topbar{padding-top:calc(14px + env(safe-area-inset-top));align-items:flex-start}
  .brand{font-size:.48rem;letter-spacing:.38em}
  .brand-sub{font-size:.56rem;letter-spacing:.16em}
  #center-ui{width:min(92vw,700px)}
  #title-main{font-size:clamp(2rem,11vw,4.4rem);letter-spacing:.18em}
  @keyframes trev{from{opacity:0;letter-spacing:.34em;transform:scale(.92)}to{opacity:1;letter-spacing:.18em;transform:scale(1)}}
  #title-sub{font-size:clamp(.58rem,2.7vw,.85rem);letter-spacing:.28em;padding:0 10px}
  #hint{font-size:.48rem;letter-spacing:.3em}
  .hr{left:18px;right:18px}
  .hr-t{top:62px}.hr-b{bottom:74px}
  #botbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:8px}
  .bs,.bs3,.bs4{text-align:center!important}
  .sl{font-size:.34rem;letter-spacing:.28em}
  .sv{font-size:.68rem}
  #upload-panel{width:min(92vw,520px)}
  .dz{width:100%;padding:22px 20px}
  #nowplay{width:min(92vw,430px)}
  .pbc{gap:8px}
  .btn{flex:1;padding:10px 12px}
}

@media (max-width: 420px){
  .tr .brand-sub,.tl .brand-sub{max-width:42vw;white-space:normal}
  #title-main{font-size:clamp(1.65rem,10.5vw,3rem)}
  #title-line{margin:14px auto}
  #hint{letter-spacing:.2em}
}

@media (orientation: landscape) and (max-height: 560px){
  #topbar{padding-top:calc(8px + env(safe-area-inset-top))}
  .brand-sub{display:none}
  #center-ui{top:45%}
  #title-main{font-size:clamp(1.8rem,7vw,3.8rem)}
  #title-sub{margin-top:8px}
  #title-line{margin:10px auto}
  #botbar{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  #nowplay{bottom:calc(8px + env(safe-area-inset-bottom))}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}

</style>
</head>
<body>

<div id="cur"></div>
<div id="cur-ring"></div>
<canvas id="c"></canvas>
<canvas id="wave-canvas"></canvas>
<div id="vig"></div>
<div id="scan"></div>
<div id="eq-bars"></div>

<div id="ui">
  <div id="topbar">
    <div class="tl">
      <span class="brand">Event Horizon Labs</span>
      <span class="brand-sub">Quantum Signal Processing</span>
    </div>
    <div class="tr">
      <span class="brand">Status</span>
      <span class="brand-sub" id="status-val">Awaiting Signal</span>
    </div>
  </div>
  <div class="cm cm-tl"><svg viewBox="0 0 22 22" fill="none"><path d="M1 21V1H21" stroke="rgba(0,245,255,.4)" stroke-width="1"/><circle cx="1" cy="1" r="1.5" fill="rgba(0,245,255,.6)"/></svg></div>
  <div class="cm cm-tr"><svg viewBox="0 0 22 22" fill="none"><path d="M21 21V1H1" stroke="rgba(0,245,255,.4)" stroke-width="1"/><circle cx="21" cy="1" r="1.5" fill="rgba(0,245,255,.6)"/></svg></div>
  <div class="cm cm-bl"><svg viewBox="0 0 22 22" fill="none"><path d="M1 1V21H21" stroke="rgba(255,0,110,.4)" stroke-width="1"/><circle cx="1" cy="21" r="1.5" fill="rgba(255,0,110,.6)"/></svg></div>
  <div class="cm cm-br"><svg viewBox="0 0 22 22" fill="none"><path d="M21 1V21H1" stroke="rgba(255,0,110,.4)" stroke-width="1"/><circle cx="21" cy="21" r="1.5" fill="rgba(255,0,110,.6)"/></svg></div>
  <div class="hr hr-t"></div><div class="hr hr-b"></div>

  <div id="center-ui">
    <div id="title-main">SINGULARITY</div>
    <div id="title-sub">Event Horizon Audio Reactor</div>
    <div id="title-line"></div>
    <div id="hint">Load Audio · Move to Interact</div>
  </div>

  <div id="botbar">
    <div class="bs bs1"><span class="sl">Particles</span><span class="sv" id="s-p">0</span></div>
    <div class="bs bs2"><span class="sl">Bass</span><span class="sv" id="s-b">—</span></div>
    <div class="bs bs3" style="text-align:center"><span class="sl">BPM</span><span class="sv" id="s-bpm">—</span></div>
    <div class="bs bs4" style="text-align:right"><span class="sl">Field</span><span class="sv" id="s-f">—</span></div>
  </div>
</div>

<!-- Upload -->
<div id="upload-panel">
  <div class="dz" id="dz" onclick="document.getElementById('fi').click()">
    <span class="dz-ico">⬡</span>
    <h3>Initialize Audio Feed</h3>
    <p>Drag MP3 · WAV · OGG · FLAC</p>
  </div>
  <input type="file" id="fi" accept="audio/*">
</div>

<!-- Now Playing -->
<div id="nowplay">
  <div id="tname">—</div>
  <div class="pbc">
    <button class="btn" id="pbtn" onclick="togglePlay()">PLAY</button>
    <button class="btn mg" onclick="newTrack()">EJECT</button>
  </div>
  <div id="pw" onclick="seekA(event)"><div id="pb"></div></div>
  <div id="td">0:00 / 0:00</div>
</div>

<audio id="aud" crossorigin="anonymous"></audio>

<script>
// ═══════════════════════════════════════════════════
// SINGULARITY — Black Hole Audio Reactive Visualizer
// ═══════════════════════════════════════════════════

const canvas  = document.getElementById('c');
const wCanvas = document.getElementById('wave-canvas');
const ctx     = canvas.getContext('2d');
const wCtx    = wCanvas.getContext('2d');

let W,H,cx,cy,t=0,playing=false;
let mx=0,my=0,curX=0,curY=0,ringX=0,ringY=0;
const curDot  = document.getElementById('cur');
const curRing = document.getElementById('cur-ring');

// Audio
const audEl = document.getElementById('aud');
let actx,analyser,src,connected=false,freqData,timeData,bufLen;
let bass=0,mid=0,high=0,avg=0,bassHist=new Array(60).fill(0),beatDetected=false;
let bpmCounter=0,bpmTimer=0,bpmDisplay=0;

function resize(){
  const cssW=window.innerWidth;
  const cssH=window.innerHeight;
  const dpr=Math.min(window.devicePixelRatio||1,2);

  W=cssW;H=cssH;cx=W/2;cy=H/2;

  for(const cv of [canvas,wCanvas]){
    cv.width=Math.round(cssW*dpr);
    cv.height=Math.round(cssH*dpr);
    cv.style.width=cssW+'px';
    cv.style.height=cssH+'px';
  }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  wCtx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(resize,120),{passive:true});
resize();

function updatePointer(x,y){
  mx=x;my=y;curX=x;curY=y;
  curDot.style.left=x+'px';curDot.style.top=y+'px';
}

window.addEventListener('pointermove',e=>{
  updatePointer(e.clientX,e.clientY);
},{passive:true});

window.addEventListener('pointerdown',e=>{
  updatePointer(e.clientX,e.clientY);
},{passive:true});

// ── AUDIO ────────────────────────────────────────
function initAudio(){
  if(!actx){
    actx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=actx.createAnalyser();
    analyser.fftSize=2048;analyser.smoothingTimeConstant=.78;
    bufLen=analyser.frequencyBinCount;
    freqData=new Uint8Array(bufLen);
    timeData=new Uint8Array(bufLen);
  }
  if(!connected){
    src=actx.createMediaElementSource(audEl);
    src.connect(analyser);analyser.connect(actx.destination);connected=true;
  }
}

function getAudio(){
  if(!analyser)return;
  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeData);
  const a=(s,e)=>{let t=0;for(let i=s;i<e&&i<bufLen;i++)t+=freqData[i];return t/(e-s)/255};
  bass=a(0,8);mid=a(8,80);high=a(80,400);avg=a(0,bufLen);
  bassHist.push(bass);bassHist.shift();
  const mean=bassHist.reduce((a,b)=>a+b)/bassHist.length;
  const prev=beatDetected;
  beatDetected=bass>mean*1.5&&bass>.2;
  // BPM tracking
  if(beatDetected&&!prev){
    bpmCounter++;
    bpmTimer+=.016;
    if(bpmCounter>=4){bpmDisplay=Math.round((bpmCounter/bpmTimer)*60);bpmCounter=0;bpmTimer=0;}
  } else { bpmTimer+=.016; if(bpmTimer>4){bpmCounter=0;bpmTimer=0;} }
}

const fiEl=document.getElementById('fi'),dzEl=document.getElementById('dz');
fiEl.addEventListener('change',e=>loadFile(e.target.files[0]));
dzEl.addEventListener('dragover',e=>{e.preventDefault();dzEl.classList.add('over')});
dzEl.addEventListener('dragleave',()=>dzEl.classList.remove('over'));
dzEl.addEventListener('drop',e=>{e.preventDefault();dzEl.classList.remove('over');loadFile(e.dataTransfer.files[0])});

function loadFile(file){
  if(!file||!file.type.startsWith('audio'))return;
  initAudio();
  audEl.src=URL.createObjectURL(file);
  const playPromise=audEl.play();
  playing=true;
  if(playPromise&&typeof playPromise.catch==='function'){
    playPromise.catch(()=>{playing=false;document.getElementById('pbtn').textContent='PLAY';});
  }
  document.getElementById('pbtn').textContent='PAUSE';
  document.getElementById('tname').textContent=file.name.replace(/\.[^.]+$/,'').toUpperCase();
  document.getElementById('upload-panel').classList.add('gone');
  document.getElementById('nowplay').classList.add('show');
  document.getElementById('eq-bars').classList.add('show');
  document.getElementById('status-val').textContent='Signal Active';
  if(actx.state==='suspended')actx.resume();
}
function togglePlay(){
  if(!audEl.src)return;
  if(actx&&actx.state==='suspended')actx.resume();
  if(playing){audEl.pause();playing=false;document.getElementById('pbtn').textContent='PLAY';}
  else{audEl.play();playing=true;document.getElementById('pbtn').textContent='PAUSE';}
}
function newTrack(){
  audEl.pause();playing=false;
  document.getElementById('upload-panel').classList.remove('gone');
  document.getElementById('nowplay').classList.remove('show');
  document.getElementById('eq-bars').classList.remove('show');
  document.getElementById('status-val').textContent='Awaiting Signal';
  fiEl.value='';bass=mid=high=avg=0;beatDetected=false;
}
function seekA(e){if(!audEl.duration)return;const r=document.getElementById('pw').getBoundingClientRect();const ratio=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));audEl.currentTime=ratio*audEl.duration;}
audEl.addEventListener('timeupdate',()=>{
  if(!audEl.duration)return;
  document.getElementById('pb').style.width=(audEl.currentTime/audEl.duration*100)+'%';
  const f=n=>`${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`;
  document.getElementById('td').textContent=`${f(audEl.currentTime)} / ${f(audEl.duration)}`;
});
audEl.addEventListener('ended',()=>{playing=false;document.getElementById('pbtn').textContent='PLAY';});

// ── EQ BARS ──────────────────────────────────────
const eqWrap=document.getElementById('eq-bars');
const EQN=80;const eqEls=[];
for(let i=0;i<EQN;i++){const d=document.createElement('div');d.className='eqb';eqWrap.appendChild(d);eqEls.push(d);}
function updateEQ(){
  if(!freqData)return;
  for(let i=0;i<EQN;i++){
    const v=(freqData[Math.floor(i/EQN*bufLen*.5)]||0)/255;
    eqEls[i].style.height=(v*52)+'px';
  }
}

// ══════════════════════════════════════════════════
// BLACK HOLE SYSTEM
// ══════════════════════════════════════════════════
// Accretion disk, event horizon, jets, particles

// ── ACCRETION DISK ───────────────────────────────
function drawAccretionDisk(){
  const baseR = Math.min(W,H)*.12;
  const audioR = playing ? bass*60 : 0;
  const R = baseR+audioR;
  const tilt = .35; // perspective tilt

  // Outer glow rings
  for(let r=0;r<6;r++){
    const rr = R*(1.8 - r*.1);
    const alpha = playing ? (.04+mid*.06)*(1-r/6) : .025*(1-r/6);
    const hue = playing ? (180+bass*80) : 185;
    ctx.beginPath();
    ctx.ellipse(cx,cy,rr,rr*tilt,0,0,Math.PI*2);
    ctx.strokeStyle=`hsla(${hue},100%,65%,${alpha})`;
    ctx.lineWidth=playing?2+bass*6:2;
    ctx.stroke();
  }

  // Bright disk bands
  const bands=12;
  for(let b=0;b<bands;b++){
    const innerR=R*(.9+b*.08);
    const outerR=R*(.95+b*.08);
    const speed=.3+b*.05;
    const angle=t*speed*(b%2===0?1:-1);
    const bandHue=playing?(160+b*12+bass*60):(160+b*12);
    const bandA=playing?(.15+avg*.2)*(1-b/bands*.5):.08*(1-b/bands*.5);

    // Draw band as rotated ellipse arc
    ctx.beginPath();
    ctx.ellipse(cx,cy,innerR+Math.sin(angle)*3,innerR*tilt,angle*.1,0,Math.PI*2);
    const grad=ctx.createLinearGradient(cx-innerR,cy,cx+innerR,cy);
    grad.addColorStop(0,`hsla(${bandHue+30},100%,80%,0)`);
    grad.addColorStop(.3,`hsla(${bandHue},100%,65%,${bandA})`);
    grad.addColorStop(.5,`hsla(${bandHue+60},100%,90%,${bandA*1.5})`);
    grad.addColorStop(.7,`hsla(${bandHue},100%,65%,${bandA})`);
    grad.addColorStop(1,`hsla(${bandHue+30},100%,80%,0)`);
    ctx.strokeStyle=grad;
    ctx.lineWidth=playing?3+mid*5:2;
    ctx.stroke();
  }
}

// ── EVENT HORIZON (black hole core) ─────────────
function drawEventHorizon(){
  const R=Math.min(W,H)*.10;
  const pulse=playing?bass*.3:0;
  const r=R*(1+pulse);

  // Outer glow corona
  const corona=ctx.createRadialGradient(cx,cy,r*.4,cx,cy,r*2.5);
  corona.addColorStop(0,`rgba(0,0,0,1)`);
  corona.addColorStop(.4,`rgba(0,0,0,.95)`);
  corona.addColorStop(.7,playing?`rgba(0,200,255,${.06+bass*.1})`:`rgba(0,200,255,.04)`);
  corona.addColorStop(1,`rgba(0,0,0,0)`);
  ctx.beginPath();ctx.arc(cx,cy,r*2.5,0,Math.PI*2);ctx.fillStyle=corona;ctx.fill();

  // Pure black void
  const bhGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  bhGrad.addColorStop(0,'rgba(0,0,0,1)');
  bhGrad.addColorStop(.85,'rgba(0,0,0,1)');
  bhGrad.addColorStop(.92,playing?`rgba(0,245,255,${.3+bass*.4})`:`rgba(0,245,255,.15)`);
  bhGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=bhGrad;ctx.fill();

  // Photon ring
  ctx.beginPath();
  ctx.arc(cx,cy,r*1.08,0,Math.PI*2);
  ctx.strokeStyle=playing?`rgba(0,245,255,${.4+bass*.5})`:`rgba(0,245,255,.2)`;
  ctx.lineWidth=playing?1.5+bass*2:1;
  ctx.stroke();

  // Beat burst ring
  if(playing&&beatDetected){
    const br=r*(1.5+bass*3);
    const bg=ctx.createRadialGradient(cx,cy,br*.7,cx,cy,br);
    bg.addColorStop(0,`rgba(0,245,255,0)`);
    bg.addColorStop(.5,`rgba(0,245,255,${bass*.5})`);
    bg.addColorStop(1,`rgba(0,0,0,0)`);
    ctx.beginPath();ctx.arc(cx,cy,br,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
  }
}

// ── RELATIVISTIC JETS ────────────────────────────
function drawJets(){
  if(!playing&&avg<.02)return;
  const jetH=Math.min(W,H)*(.45+avg*.3);
  const jetW=Math.min(W,H)*(.04+mid*.08);
  const a=playing?(.06+high*.1):.03;

  // North jet
  const ng=ctx.createLinearGradient(cx,cy,cx,cy-jetH);
  ng.addColorStop(0,`rgba(123,47,255,${a*3})`);
  ng.addColorStop(.3,`rgba(0,245,255,${a*2})`);
  ng.addColorStop(.7,`rgba(0,245,255,${a*.5})`);
  ng.addColorStop(1,`rgba(0,245,255,0)`);
  ctx.beginPath();
  ctx.moveTo(cx-jetW,cy);ctx.lineTo(cx,cy-jetH);ctx.lineTo(cx+jetW,cy);ctx.closePath();
  ctx.fillStyle=ng;ctx.fill();

  // South jet
  const sg=ctx.createLinearGradient(cx,cy,cx,cy+jetH);
  sg.addColorStop(0,`rgba(255,0,110,${a*3})`);
  sg.addColorStop(.3,`rgba(0,245,255,${a*2})`);
  sg.addColorStop(.7,`rgba(0,245,255,${a*.5})`);
  sg.addColorStop(1,`rgba(0,245,255,0)`);
  ctx.beginPath();
  ctx.moveTo(cx-jetW,cy);ctx.lineTo(cx,cy+jetH);ctx.lineTo(cx+jetW,cy);ctx.closePath();
  ctx.fillStyle=sg;ctx.fill();

  // Jet knots (bright blobs along jet)
  const knots=4;
  for(let k=1;k<=knots;k++){
    const ky=cy-jetH*(k/knots)*(playing?.8+high*.4:.6);
    const kr=jetW*(1-k/knots)*1.5*(playing?1+avg:1);
    const kg=ctx.createRadialGradient(cx,ky,0,cx,ky,kr);
    kg.addColorStop(0,`rgba(200,220,255,${a*4*(1-k/knots)})`);
    kg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(cx,ky,kr,0,Math.PI*2);ctx.fillStyle=kg;ctx.fill();
    // South mirror
    const ky2=cy+jetH*(k/knots)*(playing?.8+high*.4:.6);
    const kg2=ctx.createRadialGradient(cx,ky2,0,cx,ky2,kr);
    kg2.addColorStop(0,`rgba(200,220,255,${a*4*(1-k/knots)})`);
    kg2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(cx,ky2,kr,0,Math.PI*2);ctx.fillStyle=kg2;ctx.fill();
  }
}

// ── GRAVITATIONAL LENSING GRID ───────────────────
function drawLensingGrid(){
  const R=Math.min(W,H)*.5;
  const lines=24;
  const alpha=playing?(.025+avg*.035):.018;
  ctx.save();
  ctx.strokeStyle=`rgba(0,245,255,${alpha})`;
  ctx.lineWidth=.5;

  for(let i=0;i<lines;i++){
    const ang=(i/lines)*Math.PI*2;
    const x1=cx+Math.cos(ang)*R*.15;
    const y1=cy+Math.sin(ang)*R*.15;
    const x2=cx+Math.cos(ang)*R;
    const y2=cy+Math.sin(ang)*R;
    // Curve toward center (gravitational bending)
    const bend=playing?20+bass*40:15;
    const bendX=cx+(Math.cos(ang+Math.PI/2))*bend;
    const bendY=cy+(Math.sin(ang+Math.PI/2))*bend;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.quadraticCurveTo(bendX,bendY,x2,y2);
    ctx.stroke();
  }

  // Concentric warp rings
  for(let r=1;r<=8;r++){
    const rr=R*(r/8);
    const warp=playing?bass*20*Math.sin(t*2+r):0;
    ctx.beginPath();
    ctx.ellipse(cx,cy,rr+warp,rr*.6,t*.02*(r%2===0?1:-1),0,Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}

// ══════════════════════════════════════════════════
// PARTICLE SYSTEM — Infalling + Ejected matter
// ══════════════════════════════════════════════════

let particles=[];
const PCOUNT=1200;

class Particle{
  constructor(){this.reset(true);}
  reset(init=false){
    // Spawn on outer ring or randomly during beats
    const spawnR=Math.min(W,H)*(init?Math.random()*.5:.45+Math.random()*.1);
    const spawnA=Math.random()*Math.PI*2;
    this.x=cx+Math.cos(spawnA)*spawnR;
    this.y=cy+Math.sin(spawnA)*spawnR;

    // Orbital velocity (tangential)
    const tangent=spawnA+Math.PI/2;
    const speed=Math.random()*.8+.3;
    this.vx=Math.cos(tangent)*speed;
    this.vy=Math.sin(tangent)*speed;

    this.life=0;
    this.maxLife=200+Math.random()*400;
    this.size=Math.random()*1.6+.3;
    this.trail=[];this.trailLen=Math.floor(Math.random()*10+4);

    // Color: cyan→plasma→magenta based on proximity
    this.type=Math.random()<.7?'infalling':'ejected';
    if(this.type==='ejected'){
      // Eject from poles
      this.x=cx+(Math.random()-.5)*20;
      this.y=cy+(Math.random()-.5)*20;
      const dir=Math.random()<.5?-1:1;
      this.vx=(Math.random()-.5)*2;
      this.vy=dir*(Math.random()*3+2);
    }
    this.hue=this.type==='infalling'?170+Math.random()*50:280+Math.random()*80;
    this.alpha=0;this.tAlpha=Math.random()*.7+.2;
    this.angle=spawnA;
  }

  update(){
    this.life++;
    const prog=this.life/this.maxLife;
    if(prog<.12)this.alpha+=(this.tAlpha-this.alpha)*.1;
    else if(prog>.82)this.alpha*=.96;

    const dx=cx-this.x,dy=cy-this.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const R=Math.min(W,H)*.10;

    if(this.type==='infalling'){
      // Gravitational pull — stronger near horizon
      const grav=(playing?(.008+bass*.012):.006)*Math.pow(Math.min(W,H)*.3/d,1.5);
      this.vx+=dx/d*grav;this.vy+=dy/d*grav;
      // Relativistic spin-up near horizon
      if(d<R*3){
        const tangentX=-dy/d,tangentY=dx/d;
        const spinForce=(playing?.015+avg*.01:.008)*(R*3/d);
        this.vx+=tangentX*spinForce;this.vy+=tangentY*spinForce;
      }
      // Heat up near horizon (color shift)
      if(d<R*2) this.hue=playing?30+bass*60:30;
      // Swallowed
      if(d<R*.5){this.reset();return;}
    } else {
      // Ejected particles: rise along jet, spread
      if(playing&&high>.3){this.vx+=(Math.random()-.5)*high*.5;this.vy*=.98;}
      this.hue=playing?280+high*80:290;
    }

    // Beat disruption
    if(playing&&beatDetected&&Math.random()<.4){
      const ang=Math.random()*Math.PI*2;
      this.vx+=Math.cos(ang)*bass*4;this.vy+=Math.sin(ang)*bass*4;
    }

    // Mouse gravity (attract)
    const mdx=mx-this.x,mdy=my-this.y;
    const md=Math.sqrt(mdx*mdx+mdy*mdy)||1;
    if(md<150&&md>20){
      const mf=(150-md)/150*.5;
      this.vx+=mdx/md*mf;this.vy+=mdy/md*mf;
    }

    const damp=playing?(.92+mid*.04):.94;
    this.vx*=damp;this.vy*=damp;
    this.trail.unshift({x:this.x,y:this.y});
    if(this.trail.length>this.trailLen)this.trail.pop();
    this.x+=this.vx;this.y+=this.vy;

    // Wrap edges
    if(this.x<-50)this.x=W+50;if(this.x>W+50)this.x=-50;
    if(this.y<-50)this.y=H+50;if(this.y>H+50)this.y=-50;
    if(this.life>=this.maxLife)this.reset();
  }

  draw(){
    if(this.alpha<.005)return;
    const d=Math.sqrt((this.x-cx)**2+(this.y-cy)**2);
    const R=Math.min(W,H)*.10;
    // Don't draw inside event horizon
    if(d<R*.6)return;

    const pulse=playing&&beatDetected?(1+bass*.5):1;
    const sz=this.size*pulse;
    const sat=this.type==='infalling'?90:100;
    const light=this.type==='infalling'?65:75;

    // Trail
    if(this.trail.length>1){
      for(let i=0;i<this.trail.length-1;i++){
        const a=this.alpha*(1-i/this.trail.length)*.5;
        ctx.beginPath();
        ctx.moveTo(this.trail[i].x,this.trail[i].y);
        ctx.lineTo(this.trail[i+1].x,this.trail[i+1].y);
        ctx.strokeStyle=`hsla(${this.hue},${sat}%,${light}%,${a})`;
        ctx.lineWidth=sz*(1-i/this.trail.length)*.9;ctx.stroke();
      }
    }

    ctx.beginPath();ctx.arc(this.x,this.y,sz,0,Math.PI*2);
    ctx.fillStyle=`hsla(${this.hue},${sat}%,${light}%,${this.alpha})`;ctx.fill();

    // Glow
    if(this.alpha>.45){
      const gr=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,sz*3);
      gr.addColorStop(0,`hsla(${this.hue},100%,80%,${this.alpha*.3})`);
      gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath();ctx.arc(this.x,this.y,sz*3,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();
    }
  }
}
for(let i=0;i<PCOUNT;i++)particles.push(new Particle());

// Beat: spawn burst of ejected particles
function spawnBurst(){
  for(let i=0;i<12;i++){
    const p=particles[Math.floor(Math.random()*PCOUNT)];
    p.type='ejected';
    p.x=cx+(Math.random()-.5)*30;p.y=cy+(Math.random()-.5)*30;
    const dir=Math.random()<.5?-1:1;
    p.vx=(Math.random()-.5)*bass*8;
    p.vy=dir*(Math.random()*bass*10+2);
    p.hue=Math.random()<.5?185:310;
    p.life=0;p.alpha=0;
  }
}

// ── WAVEFORM RING ────────────────────────────────
function drawWaveformRing(){
  if(!timeData||!playing){wCtx.clearRect(0,0,W,H);return;}
  wCtx.clearRect(0,0,W,H);
  const R=Math.min(W,H)*(.32+avg*.1);
  const alpha=.5+mid*.3;

  wCtx.beginPath();
  for(let i=0;i<bufLen;i++){
    const ang=(i/bufLen)*Math.PI*2-Math.PI/2;
    const v=(timeData[i]/128-1);
    const r=R+v*(playing?40+bass*60:20);
    const x=cx+Math.cos(ang)*r;
    const y=cy+Math.sin(ang)*r;
    i===0?wCtx.moveTo(x,y):wCtx.lineTo(x,y);
  }
  wCtx.closePath();
  const hue=playing?180+bass*60:185;
  wCtx.strokeStyle=`hsla(${hue},100%,65%,${alpha*.4})`;
  wCtx.lineWidth=playing?1.5+avg*2:1;
  wCtx.stroke();

  // Second ring — high freq
  if(playing&&high>.1){
    wCtx.beginPath();
    const R2=R*1.15;
    for(let i=0;i<bufLen;i+=2){
      const ang=(i/bufLen)*Math.PI*2-Math.PI/2;
      const idx=Math.floor(i/bufLen*bufLen*.8);
      const v=(freqData[idx]||0)/255;
      const r=R2+v*(high*50);
      const x=cx+Math.cos(ang)*r;
      const y=cy+Math.sin(ang)*r;
      i===0?wCtx.moveTo(x,y):wCtx.lineTo(x,y);
    }
    wCtx.strokeStyle=`hsla(${285+high*60},100%,70%,${high*.4})`;
    wCtx.lineWidth=1;wCtx.stroke();
  }
}

// ── STATS ────────────────────────────────────────
let frame=0;
function updateStats(){
  if(frame%6!==0)return;
  document.getElementById('s-p').textContent=PCOUNT.toLocaleString();
  document.getElementById('s-b').textContent=playing?bass.toFixed(3):'—';
  document.getElementById('s-bpm').textContent=playing&&bpmDisplay>0?bpmDisplay:'—';
  document.getElementById('s-f').textContent=playing?avg.toFixed(3):'—';
}

// ── MAIN LOOP ────────────────────────────────────
let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/16.67,2);last=ts;
  frame++;t+=.016*dt;

  if(playing){getAudio();if(beatDetected)spawnBurst();}
  else{bass*=.93;mid*=.93;high*=.93;avg*=.93;beatDetected=false;}

  // Background — deep space
  const bgA=playing?(.12+bass*.06):.16;
  ctx.fillStyle=`rgba(3,3,10,${bgA})`;ctx.fillRect(0,0,W,H);

  // Star field
  if(frame%3===0){
    for(let s=0;s<3;s++){
      const sx=Math.random()*W,sy=Math.random()*H;
      const sd=Math.sqrt((sx-cx)**2+(sy-cy)**2);
      if(sd>Math.min(W,H)*.15){
        ctx.beginPath();ctx.arc(sx,sy,Math.random()*.8,0,Math.PI*2);
        ctx.fillStyle=`rgba(220,235,255,${Math.random()*.12})`;ctx.fill();
      }
    }
  }

  drawLensingGrid();
  drawJets();
  drawAccretionDisk();
  particles.forEach(p=>{p.update();p.draw();});
  drawEventHorizon();
  drawWaveformRing();
  updateEQ();
  updateStats();

  // Cursor ring smooth
  ringX+=(curX-ringX)*.09;ringY+=(curY-ringY)*.09;
  curRing.style.left=ringX+'px';curRing.style.top=ringY+'px';

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
