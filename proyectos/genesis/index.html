<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GENESIS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #c9a84c;
  --gold-light: #f0d080;
  --cream: #f5efe0;
  --ink: #0a0806;
  --ember: #e85d20;
  --void: #050403;
}

html, body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  background: var(--void);
  overflow: hidden;
  overscroll-behavior: none;
  font-family: 'Cormorant Garamond', serif;
}

@media (hover: hover) and (pointer: fine) {
  html, body { cursor: none; }
}

#cursor {
  position: fixed;
  width: 6px; height: 6px;
  background: var(--gold);
  border-radius: 50%;
  pointer-events: none;
  z-index: 1000;
  transform: translate(-50%, -50%);
  transition: width .15s, height .15s, opacity .15s;
  box-shadow: 0 0 12px 2px rgba(201,168,76,.6);
}
#cursor-ring {
  position: fixed;
  width: 36px; height: 36px;
  border: 1px solid rgba(201,168,76,.35);
  border-radius: 50%;
  pointer-events: none;
  z-index: 999;
  transform: translate(-50%, -50%);
  transition: all .08s ease-out;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

#top-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 32px 48px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

#brand {
  opacity: 0;
  animation: fadeUp .8s ease forwards 1.2s;
}
#brand-title {
  font-family: 'Cinzel', serif;
  font-size: .65rem;
  letter-spacing: .55em;
  color: rgba(201,168,76,.5);
  text-transform: uppercase;
}
#brand-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: .7rem;
  color: rgba(245,239,224,.25);
  letter-spacing: .2em;
  margin-top: 3px;
}

#top-right {
  text-align: right;
  opacity: 0;
  animation: fadeUp .8s ease forwards 1.4s;
}
#phase-label {
  font-family: 'Cinzel', serif;
  font-size: .5rem;
  letter-spacing: .5em;
  color: rgba(201,168,76,.4);
}
#phase-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: .8rem;
  color: rgba(245,239,224,.35);
  letter-spacing: .15em;
  margin-top: 2px;
}

#center-ui {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
}

#title-main {
  font-family: 'Cinzel', serif;
  font-size: clamp(3.5rem, 8vw, 7rem);
  font-weight: 700;
  letter-spacing: .4em;
  color: transparent;
  background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 40%, rgba(201,168,76,.3) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  line-height: 1;
  opacity: 0;
  animation: titleReveal 2s cubic-bezier(.16,1,.3,1) forwards .3s;
  filter: drop-shadow(0 0 40px rgba(201,168,76,.3));
}

#title-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(.8rem, 2vw, 1.1rem);
  letter-spacing: .5em;
  color: rgba(245,239,224,.3);
  margin-top: 16px;
  opacity: 0;
  animation: fadeUp .8s ease forwards 1s;
}

#title-line {
  width: 1px;
  height: 0;
  background: linear-gradient(180deg, transparent, var(--gold), transparent);
  margin: 24px auto;
  animation: lineGrow .6s ease forwards 1.6s;
}

#scroll-hint {
  font-family: 'Cinzel', serif;
  font-size: .45rem;
  letter-spacing: .5em;
  color: rgba(201,168,76,.3);
  opacity: 0;
  animation: fadeUp .6s ease forwards 2.2s, breathe 3s ease-in-out infinite 2.8s;
}

#bottom-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 32px 48px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.bottom-stat {
  opacity: 0;
  animation: fadeUp .6s ease forwards 1.8s;
}
.bottom-stat:last-child { animation-delay: 2s; }

.stat-label {
  font-family: 'Cinzel', serif;
  font-size: .42rem;
  letter-spacing: .45em;
  color: rgba(201,168,76,.35);
  display: block;
}
.stat-val {
  font-family: 'Cormorant Garamond', serif;
  font-size: .75rem;
  color: rgba(245,239,224,.25);
  letter-spacing: .15em;
  display: block;
  margin-top: 2px;
}

.corner-mark {
  position: absolute;
  width: 20px; height: 20px;
  opacity: 0;
  animation: fadeIn .4s ease forwards;
}
.corner-mark svg { width: 100%; height: 100%; }
.cm-tl { top: 24px; left: 24px; animation-delay: 2s; }
.cm-tr { top: 24px; right: 24px; animation-delay: 2.1s; }
.cm-bl { bottom: 24px; left: 24px; animation-delay: 2.2s; }
.cm-br { bottom: 24px; right: 24px; animation-delay: 2.3s; }

#vignette {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 35%, rgba(5,4,3,.85) 100%);
  pointer-events: none;
  z-index: 5;
}

#grain {
  position: fixed;
  inset: -50%;
  width: 200%; height: 200%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 6;
  opacity: .6;
  animation: grainShift 8s steps(1) infinite;
}

.h-rule {
  position: absolute;
  left: 48px; right: 48px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,.12), transparent);
  opacity: 0;
  animation: fadeIn .4s ease forwards;
}
.h-rule-top { top: 80px; animation-delay: 1.8s; }
.h-rule-bottom { bottom: 80px; animation-delay: 2s; }


@media (hover: none), (pointer: coarse) {
  #cursor,
  #cursor-ring {
    display: none;
  }
}

@media (max-width: 768px) {
  #top-bar,
  #bottom-bar {
    padding-left: max(24px, env(safe-area-inset-left));
    padding-right: max(24px, env(safe-area-inset-right));
  }

  #top-bar {
    padding-top: max(24px, env(safe-area-inset-top));
  }

  #bottom-bar {
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }

  .h-rule {
    left: 24px;
    right: 24px;
  }

  #title-main {
    font-size: clamp(2.6rem, 14vw, 5rem);
    letter-spacing: .22em;
    padding-left: .22em;
  }

  #title-sub {
    font-size: clamp(.72rem, 3.6vw, 1rem);
    letter-spacing: .28em;
    padding-left: .28em;
  }

  #scroll-hint {
    letter-spacing: .34em;
    padding-left: .34em;
  }

  @keyframes titleReveal {
    from { opacity: 0; transform: scale(.94) translateY(20px); letter-spacing: .34em; }
    to   { opacity: 1; transform: scale(1) translateY(0); letter-spacing: .22em; }
  }
}

@media (max-width: 480px) {
  #top-bar,
  #bottom-bar {
    padding-left: max(18px, env(safe-area-inset-left));
    padding-right: max(18px, env(safe-area-inset-right));
  }

  #top-bar {
    padding-top: max(18px, env(safe-area-inset-top));
  }

  #bottom-bar {
    padding-bottom: max(18px, env(safe-area-inset-bottom));
  }

  #brand-title {
    font-size: .56rem;
    letter-spacing: .36em;
  }

  #brand-sub {
    font-size: .62rem;
    letter-spacing: .12em;
  }

  #phase-label {
    font-size: .44rem;
    letter-spacing: .28em;
  }

  #phase-value {
    font-size: .68rem;
    letter-spacing: .09em;
  }

  #title-main {
    font-size: clamp(2.25rem, 15vw, 4rem);
    letter-spacing: .14em;
    padding-left: .14em;
  }

  #title-sub {
    max-width: 86vw;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.45;
    letter-spacing: .2em;
    padding-left: .2em;
  }

  #title-line {
    margin: 18px auto;
  }

  #scroll-hint {
    font-size: .42rem;
    letter-spacing: .26em;
    padding-left: .26em;
  }

  .corner-mark {
    width: 14px;
    height: 14px;
  }

  .cm-tl { top: 14px; left: 14px; }
  .cm-tr { top: 14px; right: 14px; }
  .cm-bl { bottom: 14px; left: 14px; }
  .cm-br { bottom: 14px; right: 14px; }

  .h-rule {
    left: 18px;
    right: 18px;
  }

  .h-rule-top { top: 68px; }
  .h-rule-bottom { bottom: 68px; }

  .stat-label {
    font-size: .38rem;
    letter-spacing: .3em;
  }

  .stat-val {
    font-size: .68rem;
  }

  @keyframes titleReveal {
    from { opacity: 0; transform: scale(.94) translateY(16px); letter-spacing: .24em; }
    to   { opacity: 1; transform: scale(1) translateY(0); letter-spacing: .14em; }
  }
}

@media (max-height: 520px) and (orientation: landscape) {
  #top-bar {
    padding-top: 14px;
    padding-bottom: 0;
  }

  #bottom-bar {
    padding-bottom: 14px;
    padding-top: 0;
  }

  .corner-mark,
  .h-rule,
  #title-line {
    display: none;
  }

  #center-ui {
    top: 51%;
  }

  #title-main {
    font-size: clamp(2rem, 10vw, 4rem);
  }

  #title-sub {
    margin-top: 8px;
  }

  #scroll-hint {
    margin-top: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  #brand,
  #top-right,
  #title-main,
  #title-sub,
  #scroll-hint,
  .bottom-stat,
  .corner-mark,
  .h-rule,
  #grain {
    animation: none !important;
  }

  #brand,
  #top-right,
  #title-main,
  #title-sub,
  #scroll-hint,
  .bottom-stat,
  .corner-mark,
  .h-rule {
    opacity: 1;
  }

  #title-line {
    height: 60px;
  }
}

@keyframes titleReveal {
  from { opacity: 0; transform: scale(.94) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes lineGrow {
  to { height: 60px; }
}
@keyframes breathe {
  0%, 100% { opacity: .3; }
  50%       { opacity: .6; }
}
@keyframes grainShift {
  0%   { transform: translate(0,0); }
  10%  { transform: translate(-2%,-3%); }
  20%  { transform: translate(3%, 1%); }
  30%  { transform: translate(-1%, 4%); }
  40%  { transform: translate(4%,-2%); }
  50%  { transform: translate(-3%, 3%); }
  60%  { transform: translate(2%, 0%); }
  70%  { transform: translate(-4%, 2%); }
  80%  { transform: translate(1%,-4%); }
  90%  { transform: translate(3%, 3%); }
  100% { transform: translate(0,0); }
}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<canvas id="c"></canvas>

<div id="vignette"></div>
<div id="grain"></div>

<div id="ui">
  <div id="top-bar">
    <div id="brand">
      <div id="brand-title">Studio Obscura</div>
      <div id="brand-sub">Motion Graphics Laboratory</div>
    </div>
    <div id="top-right">
      <div id="phase-label">Current Phase</div>
      <div id="phase-value">Primordial Chaos</div>
    </div>
  </div>

  <div class="corner-mark cm-tl"><svg viewBox="0 0 20 20" fill="none"><path d="M1 19V1H19" stroke="rgba(201,168,76,.4)" stroke-width="1"/></svg></div>
  <div class="corner-mark cm-tr"><svg viewBox="0 0 20 20" fill="none"><path d="M19 19V1H1" stroke="rgba(201,168,76,.4)" stroke-width="1"/></svg></div>
  <div class="corner-mark cm-bl"><svg viewBox="0 0 20 20" fill="none"><path d="M1 1V19H19" stroke="rgba(201,168,76,.4)" stroke-width="1"/></svg></div>
  <div class="corner-mark cm-br"><svg viewBox="0 0 20 20" fill="none"><path d="M19 1V19H1" stroke="rgba(201,168,76,.4)" stroke-width="1"/></svg></div>

  <div class="h-rule h-rule-top"></div>
  <div class="h-rule h-rule-bottom"></div>

  <div id="center-ui">
    <div id="title-main">GENESIS</div>
    <div id="title-sub">The Architecture of Creation</div>
    <div id="title-line"></div>
    <div id="scroll-hint">Move to Interact</div>
  </div>

  <div id="bottom-bar">
    <div class="bottom-stat">
      <span class="stat-label">Particles</span>
      <span class="stat-val" id="stat-particles">0</span>
    </div>
    <div class="bottom-stat" style="text-align:right">
      <span class="stat-label">Energy</span>
      <span class="stat-val" id="stat-energy">0.000</span>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d', { alpha: false });
let W, H, cx, cy, DPR = 1;
let mouse = { x: 0, y: 0, vx: 0, vy: 0, active: false };
let time = 0;
let phase = 0;
let phaseTime = 0;

const PHASE_DURATION = [6, 8, 10, 999];
const PHASE_NAMES = ['Primordial Chaos', 'The Gathering', 'Sacred Order', 'Eternal Bloom'];
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

function getPoolSize() {
  const area = window.innerWidth * window.innerHeight;

  if (reducedMotion) return Math.min(420, Math.max(220, Math.round(area / 2600)));
  if (window.innerWidth <= 480) return Math.min(650, Math.max(360, Math.round(area / 1500)));
  if (window.innerWidth <= 900) return Math.min(1050, Math.max(600, Math.round(area / 1250)));

  return Math.min(1800, Math.max(1100, Math.round(area / 900)));
}

let POOL_SIZE = getPoolSize();
let particles = [];

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  cx = W / 2;
  cy = H / 2;

  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (!mouse.active) {
    mouse.x = cx;
    mouse.y = cy;
  }

  const nextPoolSize = getPoolSize();
  if (particles.length && nextPoolSize !== POOL_SIZE) {
    POOL_SIZE = nextPoolSize;

    if (particles.length > POOL_SIZE) {
      particles.length = POOL_SIZE;
    } else {
      while (particles.length < POOL_SIZE) particles.push(new Particle());
    }
  } else {
    POOL_SIZE = nextPoolSize;
  }
}

window.addEventListener('resize', resize, { passive: true });
window.addEventListener('orientationchange', resize, { passive: true });
resize();

const cursorDot  = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
let cursorX = cx, cursorY = cy, ringX = cx, ringY = cy;

function setPointerPosition(x, y) {
  mouse.vx = x - mouse.x;
  mouse.vy = y - mouse.y;
  mouse.x = x;
  mouse.y = y;
  mouse.active = true;

  cursorX = x;
  cursorY = y;

  if (finePointer) {
    cursorDot.style.left = cursorX + 'px';
    cursorDot.style.top  = cursorY + 'px';
  }
}

window.addEventListener('pointermove', e => {
  setPointerPosition(e.clientX, e.clientY);
}, { passive: true });

window.addEventListener('pointerdown', e => {
  setPointerPosition(e.clientX, e.clientY);
}, { passive: true });

window.addEventListener('pointerup', () => {
  if (!finePointer) mouse.active = false;
}, { passive: true });

window.addEventListener('pointercancel', () => {
  if (!finePointer) mouse.active = false;
}, { passive: true });

window.addEventListener('pointerleave', () => {
  if (finePointer) mouse.active = false;
}, { passive: true });

document.getElementById('scroll-hint').textContent =
  finePointer ? 'Move to Interact' : 'Touch to Interact';

class Particle {
  constructor() { this.reset(); }

  reset() {
    const angle  = Math.random() * Math.PI * 2;
    const radius = Math.random() * Math.min(W,H) * .5;
    this.x  = cx + Math.cos(angle) * radius * Math.random();
    this.y  = cy + Math.sin(angle) * radius * Math.random();
    const speed = Math.random() * .8 + .1;
    this.vx = (Math.random() - .5) * speed * 2;
    this.vy = (Math.random() - .5) * speed * 2;
    this.life    = 0;
    this.maxLife = 180 + Math.random() * 300;
    this.size    = Math.random() * 1.8 + .3;
    const palette = [
      [201,168, 76],
      [240,208,120],
      [232, 93, 32],
      [245,239,224],
      [180,130, 50],
    ];
    const col = palette[Math.floor(Math.random() * palette.length)];
    this.r = col[0]; this.g = col[1]; this.b = col[2];
    this.alpha = 0;
    this.targetAlpha = Math.random() * .7 + .2;
    this.orbitAngle  = angle;
    this.orbitRadius = radius;
    this.orbitSpeed  = (Math.random() - .5) * .008;
    this.orbitEcc    = .5 + Math.random() * .5;
    this.noiseOffset = Math.random() * 1000;
    this.trail = [];
    this.trailLen = Math.floor(Math.random() * 8 + 3);
    this.active = true;
    return this;
  }

  update() {
    this.life++;
    const t2 = this.life / this.maxLife;
    if(t2 < .1) this.alpha += (this.targetAlpha - this.alpha) * .1;
    else if(t2 > .8) this.alpha *= .97;

    this.trail.unshift({ x: this.x, y: this.y, a: this.alpha });
    if(this.trail.length > this.trailLen) this.trail.pop();

    if(phase === 0)      this._chaos();
    else if(phase === 1) this._gather();
    else if(phase === 2) this._orbit();
    else                 this._bloom();

    if(mouse.active) {
      const mdx = this.x - mouse.x;
      const mdy = this.y - mouse.y;
      const md  = Math.sqrt(mdx*mdx + mdy*mdy) || 1;
      const interactionRadius = finePointer ? 120 : 145;

      if(md < interactionRadius) {
        const force = (interactionRadius - md) / interactionRadius;
        const strength = finePointer ? 1.5 : 1.25;
        this.vx += (mdx/md) * force * strength;
        this.vy += (mdy/md) * force * strength;
      }
    }

    this.vx *= .94; this.vy *= .94;
    this.x  += this.vx; this.y  += this.vy;

    if(this.x < -50)  this.x = W + 50;
    if(this.x > W+50) this.x = -50;
    if(this.y < -50)  this.y = H + 50;
    if(this.y > H+50) this.y = -50;

    if(this.life >= this.maxLife) this.reset();
  }

  _chaos() {
    const n = this.noiseOffset + time * .5;
    this.vx += Math.sin(n*1.3 + this.y*.01) * .15;
    this.vy += Math.cos(n*.9  + this.x*.01) * .15;
  }

  _gather() {
    const dx = cx - this.x, dy = cy - this.y;
    const d  = Math.sqrt(dx*dx + dy*dy) || 1;
    this.vx += dx/d * .018;
    this.vy += dy/d * .018;
    this.vx += (-dy/d) * .008;
    this.vy += ( dx/d) * .008;
  }

  _orbit() {
    this.orbitAngle += this.orbitSpeed;
    const tx = cx + Math.cos(this.orbitAngle) * this.orbitRadius * this.orbitEcc;
    const ty = cy + Math.sin(this.orbitAngle) * this.orbitRadius;
    this.vx += (tx - this.x) * .015;
    this.vy += (ty - this.y) * .015;
  }

  _bloom() {
    const ang = Math.atan2(this.y - cy, this.x - cx);
    const targetR = 80 + Math.sin(ang*6 + time*.5)*60 + Math.cos(ang*3 + time*.3)*40 + this.orbitRadius*.3;
    const tx = cx + Math.cos(ang) * targetR;
    const ty = cy + Math.sin(ang) * targetR;
    this.vx += (tx - this.x) * .012;
    this.vy += (ty - this.y) * .012;
    this.orbitAngle += this.orbitSpeed * .5;
  }

  draw() {
    if(this.alpha < .005) return;
    if(this.trail.length > 1) {
      for(let i=0; i<this.trail.length-1; i++) {
        const a = this.trail[i].a * (1 - i/this.trail.length) * .4;
        ctx.beginPath();
        ctx.moveTo(this.trail[i].x,   this.trail[i].y);
        ctx.lineTo(this.trail[i+1].x, this.trail[i+1].y);
        ctx.strokeStyle = `rgba(${this.r},${this.g},${this.b},${a})`;
        ctx.lineWidth = this.size * (1 - i/this.trail.length) * .8;
        ctx.stroke();
      }
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${this.r},${this.g},${this.b},${this.alpha})`;
    ctx.fill();
    if(this.alpha > .5 && this.size > 1) {
      const grd = ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size*2.5);
      grd.addColorStop(0, `rgba(${this.r},${this.g},${this.b},${this.alpha*.3})`);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(this.x,this.y,this.size*2.5,0,Math.PI*2);
      ctx.fillStyle = grd; ctx.fill();
    }
  }
}

for(let i=0; i<POOL_SIZE; i++) particles.push(new Particle());

function drawGeometry() {
  if(phase < 2) return;
  const alpha = .15;
  const R = Math.min(W,H) * .28;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = 'rgba(201,168,76,1)';
  ctx.lineWidth = .5;

  const rings = phase === 3 ? 3 : 1;
  for(let ring=0; ring<=rings; ring++) {
    const centers = ring === 0 ? [[cx,cy]] :
      Array.from({length:6},(_,i)=>[
        cx + Math.cos(i*Math.PI/3 + time*.05)*R*.5*ring,
        cy + Math.sin(i*Math.PI/3 + time*.05)*R*.5*ring
      ]);
    centers.forEach(([ox,oy])=>{
      ctx.beginPath(); ctx.arc(ox,oy,R*.5,0,Math.PI*2); ctx.stroke();
    });
  }

  if(phase === 3) {
    const pts = 5;
    ctx.beginPath();
    for(let i=0; i<=pts; i++) {
      const a = (i/pts)*Math.PI*2 - Math.PI/2 + time*.03;
      i===0 ? ctx.moveTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R)
            : ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R);
    }
    ctx.stroke();

    ctx.beginPath();
    for(let i=0; i<pts*2; i++) {
      const a = (i/(pts*2))*Math.PI*2 - Math.PI/2 + time*.03;
      const r = i%2===0 ? R : R*.382;
      i===0 ? ctx.moveTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r)
            : ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
    }
    ctx.closePath(); ctx.stroke();
  }

  ctx.globalAlpha = alpha * .5;
  ctx.beginPath(); ctx.moveTo(cx, cy-R*1.2); ctx.lineTo(cx, cy+R*1.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-R*1.2, cy); ctx.lineTo(cx+R*1.2, cy); ctx.stroke();
  ctx.restore();
}

function drawNebula() {
  const intensity = phase===0?.15 : phase===1?(.3+Math.sin(time*.8)*.1) : phase===2?.25 : (.35+Math.sin(time*.4)*.1);
  const radius    = phase===0?Math.min(W,H)*.3 : phase===1?(Math.min(W,H)*.2+Math.sin(time)*.05*Math.min(W,H)) : Math.min(W,H)*.22;
  const grd = ctx.createRadialGradient(cx,cy,0,cx,cy,radius);
  grd.addColorStop(0,  `rgba(201,168,76,${intensity*.3})`);
  grd.addColorStop(.2, `rgba(180,100,30,${intensity*.2})`);
  grd.addColorStop(.6, `rgba(80,40,10,${intensity*.08})`);
  grd.addColorStop(1,  'rgba(5,4,3,0)');
  ctx.beginPath(); ctx.arc(cx,cy,radius,0,Math.PI*2);
  ctx.fillStyle=grd; ctx.fill();
}

function drawBeams() {
  if(phase < 1) return;
  const count = phase===1?3:phase===2?6:8;
  const alpha = phase===1?.04:.025;
  ctx.save();
  for(let i=0; i<count; i++) {
    const ang = (i/count)*Math.PI*2 + time*.04;
    const len = Math.min(W,H)*.55;
    const grd = ctx.createLinearGradient(cx,cy,cx+Math.cos(ang)*len,cy+Math.sin(ang)*len);
    grd.addColorStop(0, `rgba(201,168,76,${alpha*3})`);
    grd.addColorStop(.4,`rgba(201,168,76,${alpha})`);
    grd.addColorStop(1, 'rgba(201,168,76,0)');
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang)*len,cy+Math.sin(ang)*len);
    ctx.strokeStyle=grd; ctx.lineWidth=40+Math.sin(time+i)*10; ctx.stroke();
  }
  ctx.restore();
}

function updateStats() {
  let energy = 0;
  particles.forEach(p => { energy += Math.sqrt(p.vx*p.vx+p.vy*p.vy)*p.alpha; });
  document.getElementById('stat-particles').textContent = POOL_SIZE.toLocaleString();
  document.getElementById('stat-energy').textContent = energy.toFixed(3);
}

let last = 0;
function loop(ts) {
  if (!last) last = ts;
  const dt = Math.min((ts-last)/16.67, 2);
  last = ts;
  time += .016 * dt;
  phaseTime += .016 * dt;

  if(phaseTime >= PHASE_DURATION[phase]) {
    phase = Math.min(phase+1, 3);
    if(phase < 3) phaseTime = 0;
    document.getElementById('phase-value').textContent = PHASE_NAMES[phase];
  }

  ctx.fillStyle = `rgba(5,4,3,${phase===0?.25:.18})`;
  ctx.fillRect(0,0,W,H);

  drawNebula();
  drawBeams();
  drawGeometry();
  particles.forEach(p => { p.update(); p.draw(); });

  if(finePointer) {
    ringX += (cursorX-ringX)*.1;
    ringY += (cursorY-ringY)*.1;
    cursorRing.style.left = ringX+'px';
    cursorRing.style.top  = ringY+'px';
  }

  if(Math.floor(time*8)%8===0) updateStats();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
